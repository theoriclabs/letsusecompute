<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Bits per byte on 10 MB of held-out enwik8</title>
  <desc id="d">The character model plus rANS uses 1.817 bits per byte. xz uses 2.144. gzip uses 2.871.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Bits per byte on the last 10 MB</text>
  <text x="48" y="80" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">Lower is better. Same 10,000,000 bytes for every bar.</text>
  
  <text x="264" y="146" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">char LM + rANS</text>
  <text x="264" y="168" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">2.27 MB</text>
  <rect x="280" y="118" width="531.6" height="64" rx="8" fill="#3d6b8a"/>
  <text x="795.6" y="158" font-size="22" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">1.817</text>

  <text x="264" y="246" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">xz -9</text>
  <text x="264" y="268" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">2.68 MB</text>
  <rect x="280" y="218" width="627.4" height="64" rx="8" fill="#c4a484"/>
  <text x="891.4" y="258" font-size="22" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">2.144</text>

  <text x="264" y="346" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">gzip -9</text>
  <text x="264" y="368" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">3.59 MB</text>
  <rect x="280" y="318" width="840.0" height="64" rx="8" fill="#7a8b99"/>
  <text x="1104.0" y="358" font-size="22" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">2.871</text>

  <text x="48" y="456" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">gzip.compress(level=9) and lzma.compress(preset=9) in the Python standard library.</text>
</svg>
