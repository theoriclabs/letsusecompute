<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">enwik8 is split 90 MB train and 10 MB test</title>
  <desc id="d">First 90 million bytes train. Last 10 million bytes are the holdout.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="26" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">First 90 MB train. Last 10 MB test.</text>
  <rect x="48" y="100" width="993.6" height="72" fill="#3d6b8a"/>
  <rect x="1041.6" y="100" width="110.4" height="72" fill="#c45c26"/>
  <text x="68" y="146" font-size="20" font-weight="700" fill="#fff" font-family="system-ui, sans-serif">train 90 MB</text>
  <rect x="48" y="192" width="14" height="14" rx="3" fill="#3d6b8a"/>
  <text x="70" y="204" font-size="15" fill="#1a1a1a" font-family="system-ui, sans-serif">train 90,000,000 bytes</text>
  <rect x="340" y="192" width="14" height="14" rx="3" fill="#c45c26"/>
  <text x="362" y="204" font-size="15" fill="#1a1a1a" font-family="system-ui, sans-serif">holdout 10,000,000 bytes</text>
  <text x="48" y="248" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">enwik8: first 100 MB of the 2006 English Wikipedia XML dump. Split by byte offset, not by article.</text>
</svg>
