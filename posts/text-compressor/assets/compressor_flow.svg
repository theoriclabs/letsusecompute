<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Bytes go into a character GPT, then a range coder writes a bitstream</title>
  <desc id="d">The model emits a 256-way next-byte distribution. rANS turns that into bits. Decode rebuilt the first 32,768 holdout bytes exactly.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">A language model is a compressor</text>
  <text x="48" y="80" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">Next-byte probabilities plus a range coder. Decode must invert that.</text>
  <rect x="48" y="130" width="220" height="150" rx="16" fill="#ffffff" stroke="#ddd4c6" stroke-width="2"/>
  <text x="68" y="188" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Holdout bytes</text>
  <text x="68" y="216" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">10 MB of enwik8</text>
  <text x="68" y="240" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">never seen in training</text>
  <path d="M278 205 H318" stroke="#7a8b99" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="328" y="118" width="280" height="174" rx="16" fill="#f4dccb" stroke="#c45c26" stroke-width="3"/>
  <text x="348" y="168" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Char GPT</text>
  <text x="348" y="196" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">3,356,160 params</text>
  <text x="348" y="220" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">256-byte context</text>
  <text x="348" y="256" font-size="14" font-weight="700" fill="#c45c26" font-family="system-ui, sans-serif">P(next byte)</text>
  <path d="M618 205 H658" stroke="#3d6b8a" stroke-width="3" fill="none" marker-end="url(#as)"/>
  <rect x="668" y="130" width="220" height="150" rx="16" fill="#ffffff" stroke="#3d6b8a" stroke-width="3"/>
  <text x="688" y="188" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">rANS</text>
  <text x="688" y="216" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">12-bit frequencies</text>
  <text x="688" y="240" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">decode checked 32 KB</text>
  <path d="M898 205 H938" stroke="#3d6b4f" stroke-width="3" fill="none" marker-end="url(#ag)"/>
  <rect x="948" y="130" width="204" height="150" rx="16" fill="#d5e8dd" stroke="#3d6b4f" stroke-width="3"/>
  <text x="968" y="188" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">2.27 MB</text>
  <text x="968" y="216" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">1.817 bits/byte</text>
  <text x="968" y="240" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">beats gzip and xz</text>
  <text x="48" y="370" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">Measured on run_ea0ca7f6a97ca6bf787f075bb8dc1af1. Cross-entropy is 1.738 bits/byte; the coder spends 0.079 extra on quantized frequencies.</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7a8b99"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3d6b8a"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3d6b4f"/></marker>
  </defs>
</svg>
