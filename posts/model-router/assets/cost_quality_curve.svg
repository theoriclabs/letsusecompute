<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Measured cost versus quality for prompt routing policies</title>
  <desc id="desc">Always Mixtral is cheapest at 88.3% quality. DistilBERT at the 95% target is cheaper than TF-IDF and much cheaper than always GPT-4. Oracle is the best possible router using the held-out labels.</desc>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="58" y="24" font-size="15" fill="#1a1a1a">Cost vs quality on 10,000 held-out prompts</text>
  <line x1="58.0" y1="58" x2="58.0" y2="382" stroke="#eee6da" /><text x="58.0" y="398" font-size="11" fill="#5c5c5c" text-anchor="middle">$0.000</text><line x1="199.7" y1="58" x2="199.7" y2="382" stroke="#eee6da" /><text x="199.7" y="398" font-size="11" fill="#5c5c5c" text-anchor="middle">$0.002</text><line x1="341.4" y1="58" x2="341.4" y2="382" stroke="#eee6da" /><text x="341.4" y="398" font-size="11" fill="#5c5c5c" text-anchor="middle">$0.004</text><line x1="483.1" y1="58" x2="483.1" y2="382" stroke="#eee6da" /><text x="483.1" y="398" font-size="11" fill="#5c5c5c" text-anchor="middle">$0.006</text><line x1="624.8" y1="58" x2="624.8" y2="382" stroke="#eee6da" /><text x="624.8" y="398" font-size="11" fill="#5c5c5c" text-anchor="middle">$0.008</text><line x1="58" y1="337.3" x2="702" y2="337.3" stroke="#eee6da" /><text x="50.0" y="341.3" font-size="11" fill="#5c5c5c" text-anchor="end">88%</text><line x1="58" y1="292.6" x2="702" y2="292.6" stroke="#eee6da" /><text x="50.0" y="296.6" font-size="11" fill="#5c5c5c" text-anchor="end">90%</text><line x1="58" y1="247.9" x2="702" y2="247.9" stroke="#eee6da" /><text x="50.0" y="251.9" font-size="11" fill="#5c5c5c" text-anchor="end">92%</text><line x1="58" y1="203.2" x2="702" y2="203.2" stroke="#eee6da" /><text x="50.0" y="207.2" font-size="11" fill="#5c5c5c" text-anchor="end">94%</text><line x1="58" y1="158.6" x2="702" y2="158.6" stroke="#eee6da" /><text x="50.0" y="162.6" font-size="11" fill="#5c5c5c" text-anchor="end">96%</text><line x1="58" y1="113.9" x2="702" y2="113.9" stroke="#eee6da" /><text x="50.0" y="117.9" font-size="11" fill="#5c5c5c" text-anchor="end">98%</text><line x1="58" y1="69.2" x2="702" y2="69.2" stroke="#eee6da" /><text x="50.0" y="73.2" font-size="11" fill="#5c5c5c" text-anchor="end">100%</text>
  <line x1="58.0" y1="180.9" x2="702.0" y2="180.9" stroke="#c45c26" stroke-dasharray="5 4" stroke-width="1.2"/>
  <text x="702" y="172.9" font-size="11" fill="#c45c26" text-anchor="end">95% of always-GPT-4 quality</text>
  <circle cx="64.5" cy="330.1" r="6" fill="#3d6b4f" /><text x="74.5" y="348.1" font-size="12" fill="#3d6b4f" text-anchor="start">Always Mixtral</text><circle cx="241.6" cy="176.2" r="6" fill="#7a8b99" /><text x="251.6" y="162.2" font-size="12" fill="#7a8b99" text-anchor="start">TF-IDF @ 95%</text><circle cx="224.9" cy="177.4" r="6" fill="#c45c26" /><text x="234.9" y="195.4" font-size="12" fill="#c45c26" text-anchor="start">DistilBERT @ 95%</text><circle cx="141.9" cy="145.9" r="6" fill="#8a5a2b" /><text x="151.9" y="149.9" font-size="12" fill="#8a5a2b" text-anchor="start">Oracle</text><circle cx="654.3" cy="69.2" r="6" fill="#1a1a1a" /><text x="644.3" y="59.2" font-size="12" fill="#1a1a1a" text-anchor="end">Always GPT-4</text>
  <text x="58" y="428" font-size="11" fill="#5c5c5c">x = mean list-price USD / prompt · y = mean quality · points are measured, not interpolated</text>
</svg>
