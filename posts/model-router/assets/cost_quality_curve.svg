<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Measured cost versus quality for five routing policies</title>
  <desc id="d">Always Mixtral is cheapest at 88.3 percent quality. DistilBERT and TF-IDF sit on the 95 percent line. Always GPT-4 is most expensive.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="44" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Cost vs quality</text>
  <text x="48" y="74" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">10,000 held-out prompts · points are measured, not interpolated</text>
  <line x1="88.0" y1="88" x2="88.0" y2="552" stroke="#ddd4c6"/><text x="88.0" y="580" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">$0.000</text><line x1="309.2" y1="88" x2="309.2" y2="552" stroke="#ddd4c6"/><text x="309.2" y="580" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">$0.002</text><line x1="530.4" y1="88" x2="530.4" y2="552" stroke="#ddd4c6"/><text x="530.4" y="580" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">$0.004</text><line x1="751.7" y1="88" x2="751.7" y2="552" stroke="#ddd4c6"/><text x="751.7" y="580" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">$0.006</text><line x1="972.9" y1="88" x2="972.9" y2="552" stroke="#ddd4c6"/><text x="972.9" y="580" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">$0.008</text><line x1="88" y1="490.1" x2="1112" y2="490.1" stroke="#ddd4c6"/><text x="76.0" y="495.1" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">88%</text><line x1="88" y1="428.3" x2="1112" y2="428.3" stroke="#ddd4c6"/><text x="76.0" y="433.3" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">90%</text><line x1="88" y1="366.4" x2="1112" y2="366.4" stroke="#ddd4c6"/><text x="76.0" y="371.4" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">92%</text><line x1="88" y1="304.5" x2="1112" y2="304.5" stroke="#ddd4c6"/><text x="76.0" y="309.5" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">94%</text><line x1="88" y1="242.7" x2="1112" y2="242.7" stroke="#ddd4c6"/><text x="76.0" y="247.7" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">96%</text><line x1="88" y1="180.8" x2="1112" y2="180.8" stroke="#ddd4c6"/><text x="76.0" y="185.8" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">98%</text><line x1="88" y1="118.9" x2="1112" y2="118.9" stroke="#ddd4c6"/><text x="76.0" y="123.9" font-size="14" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">100%</text>
  <line x1="88.0" y1="273.6" x2="1112.0" y2="273.6" stroke="#c45c26" stroke-dasharray="6 5" stroke-width="2"/>
  <text x="1112" y="261.6" font-size="14" fill="#c45c26" text-anchor="end" font-family="system-ui, sans-serif">95% of always-GPT-4 quality</text>
  <circle cx="98.2" cy="480.1" r="9" fill="#3d6b4f"/><text x="110.2" y="502.1" font-size="16" font-weight="700" fill="#3d6b4f" text-anchor="start" font-family="system-ui, sans-serif">Always Mixtral</text><circle cx="219.0" cy="225.1" r="9" fill="#8a5a2b"/><text x="231.0" y="215.1" font-size="16" font-weight="700" fill="#8a5a2b" text-anchor="start" font-family="system-ui, sans-serif">Oracle</text><circle cx="348.6" cy="268.7" r="9" fill="#c45c26"/><text x="360.6" y="292.7" font-size="16" font-weight="700" fill="#c45c26" text-anchor="start" font-family="system-ui, sans-serif">DistilBERT @ 95%</text><circle cx="374.6" cy="267.2" r="9" fill="#7a8b99"/><text x="386.6" y="253.2" font-size="16" font-weight="700" fill="#7a8b99" text-anchor="start" font-family="system-ui, sans-serif">TF-IDF @ 95%</text><circle cx="1018.9" cy="118.9" r="9" fill="#1a1a1a"/><text x="1006.9" y="106.9" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">Always GPT-4</text>
  <text x="48" y="622" font-size="13" fill="#5c5c5c" font-family="system-ui, sans-serif">x = mean list-price USD / prompt · y = mean quality (Mixtral score / 5 if cheap, else 1.0)</text>
</svg>
