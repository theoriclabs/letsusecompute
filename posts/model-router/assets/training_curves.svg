<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">DistilBERT train loss, eval loss, and eval accuracy over two epochs</title>
  <desc id="d">Train loss fell from 0.594 to 0.522. Eval loss rose slightly from 0.562 to 0.578. Eval accuracy rose from 73.0 percent to 76.9 percent.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="44" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Two epochs on 109,101 prompts</text>
  <text x="48" y="74" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">Accuracy is the side metric. The cost-quality point is chosen after training.</text>
  <polyline fill="none" stroke="#3d6b8a" stroke-width="3" points="80.0,174.8 1120.0,345.2"/>
  <polyline fill="none" stroke="#c45c26" stroke-width="3" points="80.0,250.5 1120.0,212.7"/>
  <polyline fill="none" stroke="#3d6b4f" stroke-width="3" stroke-dasharray="7 6" points="80.0,332.4 1120.0,192.3"/>
  <circle cx="80.0" cy="174.8" r="6" fill="#3d6b8a"/><circle cx="80.0" cy="250.5" r="6" fill="#c45c26"/><circle cx="80.0" cy="332.4" r="6" fill="#3d6b4f"/><circle cx="1120.0" cy="345.2" r="6" fill="#3d6b8a"/><circle cx="1120.0" cy="212.7" r="6" fill="#c45c26"/><circle cx="1120.0" cy="192.3" r="6" fill="#3d6b4f"/>
  <text x="80.0" y="484" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">epoch 1</text>
  <text x="1120.0" y="484" font-size="14" fill="#5c5c5c" text-anchor="middle" font-family="system-ui, sans-serif">epoch 2</text>
  <rect x="48" y="470" width="12" height="12" fill="#3d6b8a"/><text x="66" y="481" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">train loss 0.594 → 0.522</text>
  <rect x="320" y="470" width="12" height="12" fill="#c45c26"/><text x="338" y="481" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">eval loss 0.562 → 0.578</text>
  <rect x="600" y="470" width="12" height="12" fill="#3d6b4f"/><text x="618" y="481" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">eval accuracy 73.0% → 76.9%</text>
</svg>
