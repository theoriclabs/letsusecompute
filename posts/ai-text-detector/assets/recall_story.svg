<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">DistilBERT flags almost every ChatGPT answer and most GPT-4 and Llama answers walk through</title>
  <desc id="d">AI recall is 99.9 percent on HC3 ChatGPT answers and 22.8 percent on RAID GPT-4 and Llama-chat text.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Change the generator</text>
  <text x="48" y="80" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">Same DistilBERT weights. Same 0.5 threshold. AI recall only.</text>
  <text x="48" y="128" font-size="15" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">HC3 holdout · ChatGPT</text>
  <rect x="48" y="140" width="1102.5" height="64" fill="#3d6b8a"/>
  <rect x="1150.5" y="140" width="2.0" height="64" fill="#ddd4c6"/>
  <text x="68" y="182" font-size="22" font-weight="700" fill="#fff" font-family="system-ui, sans-serif">flagged 99.9%</text>
  <text x="48" y="248" font-size="15" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">RAID · GPT-4 + Llama-chat</text>
  <rect x="48" y="260" width="251.2" height="64" fill="#c45c26"/>
  <rect x="299.2" y="260" width="852.8" height="64" fill="#f4dccb"/>
  <text x="64" y="302" font-size="18" font-weight="700" fill="#fff" font-family="system-ui, sans-serif">flagged 22.8%</text>
  <text x="1136" y="302" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">walked through 77.2%</text>
  <text x="48" y="388" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">2,251 ChatGPT answers on HC3 · 400 RAID generations (200 GPT-4, 200 Llama-chat) · no adversarial attacks</text>
</svg>
