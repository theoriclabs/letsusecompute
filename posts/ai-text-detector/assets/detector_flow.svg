<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">An answer goes into DistilBERT, which predicts human or AI</title>
  <desc id="d">The classifier reads the answer text only. On HC3 it almost always flags ChatGPT. On RAID most GPT-4 and Llama answers are called human.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">What the detector does</text>
  <text x="48" y="80" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">It does not answer the question. It only reads the answer.</text>
  <rect x="48" y="130" width="240" height="160" rx="16" fill="#ffffff" stroke="#ddd4c6" stroke-width="2"/>
  <text x="68" y="188" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Answer text</text>
  <text x="68" y="216" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">HC3 or RAID</text>
  <text x="68" y="240" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">human or model</text>
  <path d="M298 210 H338" stroke="#7a8b99" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="348" y="118" width="300" height="184" rx="16" fill="#f4dccb" stroke="#c45c26" stroke-width="3"/>
  <text x="368" y="168" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">DistilBERT</text>
  <text x="368" y="196" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">67M params · 2-class head</text>
  <text x="368" y="220" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">threshold 0.5</text>
  <text x="368" y="256" font-size="14" font-weight="700" fill="#c45c26" font-family="system-ui, sans-serif">P(this is AI)</text>
  <path d="M648 160 H698" stroke="#3d6b4f" stroke-width="3" fill="none" marker-end="url(#ag)"/>
  <path d="M648 260 H698" stroke="#3d6b8a" stroke-width="3" fill="none" marker-end="url(#as)"/>
  <rect x="708" y="96" width="444" height="112" rx="16" fill="#d5e8dd" stroke="#3d6b4f" stroke-width="3"/>
  <text x="728" y="140" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Called human</text>
  <text x="728" y="168" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">HC3 humans: 99.0% correct</text>
  <text x="728" y="190" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">RAID AI: 77.2% sneak through</text>
  <rect x="708" y="232" width="444" height="112" rx="16" fill="#ffffff" stroke="#3d6b8a" stroke-width="3"/>
  <text x="728" y="276" font-size="18" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Called AI</text>
  <text x="728" y="304" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">HC3 ChatGPT: 99.9% caught</text>
  <text x="728" y="326" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">RAID humans flagged: 0.5%</text>
  <text x="48" y="390" font-size="14" fill="#5c5c5c" font-family="system-ui, sans-serif">Measured on run_ea7b0d5c56f928808c3096a232e3e0bd. TF-IDF is the laptop baseline, not shown here.</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7a8b99"/></marker>
    <marker id="as" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3d6b8a"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3d6b4f"/></marker>
  </defs>
</svg>
