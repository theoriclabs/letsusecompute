<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">Accuracy across three tests</title>
  <desc id="d">DistilBERT accuracy is 99.4 percent on HC3, 98.1 percent on medicine, and 48.3 percent on RAID.</desc>
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="48" y="48" font-size="28" font-weight="700" fill="#1a1a1a" font-family="system-ui, sans-serif">Accuracy across three tests</text>
  <text x="48" y="80" font-size="16" fill="#5c5c5c" font-family="system-ui, sans-serif">DistilBERT in steel, TF-IDF in gray. Chance on the RAID mix is 50%.</text>
  
  <text x="264" y="140" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">HC3 · DistilBERT</text>
  <text x="264" y="160" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">4,502 held-out answers</text>
  <rect x="280" y="118" width="835.1" height="52" rx="8" fill="#3d6b8a"/>
  <text x="1101.1" y="152" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">99.4%</text>

  <text x="264" y="220" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">HC3 · TF-IDF</text>
  <text x="264" y="240" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">same split</text>
  <rect x="280" y="198" width="815.4" height="52" rx="8" fill="#7a8b99"/>
  <text x="1081.4" y="232" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">97.1%</text>

  <text x="264" y="300" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">Medicine · DistilBERT</text>
  <text x="264" y="320" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">still ChatGPT, new domain</text>
  <rect x="280" y="278" width="824.1" height="52" rx="8" fill="#3d6b8a"/>
  <text x="1090.1" y="312" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">98.1%</text>

  <text x="264" y="380" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">Medicine · TF-IDF</text>
  <text x="264" y="400" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">1,244 questions held out</text>
  <rect x="280" y="358" width="814.7" height="52" rx="8" fill="#7a8b99"/>
  <text x="1080.7" y="392" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">97.0%</text>

  <text x="264" y="460" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">RAID · DistilBERT</text>
  <text x="264" y="480" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">GPT-4 + Llama + human</text>
  <rect x="280" y="438" width="406.0" height="52" rx="8" fill="#c45c26"/>
  <text x="672.0" y="472" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">48.3%</text>

  <text x="264" y="540" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="end" font-family="system-ui, sans-serif">RAID · TF-IDF</text>
  <text x="264" y="560" font-size="13" fill="#5c5c5c" text-anchor="end" font-family="system-ui, sans-serif">600 streamed rows</text>
  <rect x="280" y="518" width="414.4" height="52" rx="8" fill="#c4a484"/>
  <text x="680.4" y="552" font-size="18" font-weight="700" fill="#fff" text-anchor="end" font-family="system-ui, sans-serif">49.3%</text>

  <text x="48" y="598" font-size="13" fill="#5c5c5c" font-family="system-ui, sans-serif">Threshold 0.5. RAID is 200 human, 200 GPT-4, and 200 Llama-chat documents.</text>
</svg>
