<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img">
  <rect width="100%" height="100%" fill="#f5f1e8"/>
  <style>
    .title { font: 700 36px system-ui, sans-serif; fill: #17201e; }
    .head { font: 700 19px system-ui, sans-serif; fill: #17201e; }
    .body { font: 15px system-ui, sans-serif; fill: #53605b; }
    .small { font: 13px system-ui, sans-serif; fill: #53605b; }
    .arrow { stroke: #6c7772; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6c7772"/></marker></defs>
  <text x="60" y="62" class="title">Staged ResNet18 transfer learning</text>
  <text x="60" y="95" class="body">128×128 RGB input • torchvision IMAGENET1K_V1 initialization</text>
  <rect x="60" y="150" width="210" height="145" rx="18" fill="#dfe6e1" stroke="#708078" stroke-width="3"/>
  <text x="78" y="204" class="head">stem + layer1</text>
  <text x="78" y="238" class="body">frozen</text>
  <path d="M277 222.5 H287" class="arrow"/>
  <rect x="295" y="150" width="190" height="145" rx="18" fill="#dfe6e1" stroke="#708078" stroke-width="3"/>
  <text x="313" y="204" class="head">layer2</text>
  <text x="313" y="238" class="body">frozen</text>
  <path d="M492 222.5 H502" class="arrow"/>
  <rect x="510" y="150" width="190" height="145" rx="18" fill="#dfe6e1" stroke="#708078" stroke-width="3"/>
  <text x="528" y="204" class="head">layer3</text>
  <text x="528" y="238" class="body">frozen</text>
  <path d="M707 222.5 H717" class="arrow"/>
  <rect x="725" y="150" width="230" height="145" rx="18" fill="#f4dccb" stroke="#b56b39" stroke-width="3"/>
  <text x="743" y="204" class="head">layer4</text>
  <text x="743" y="238" class="body">epoch 5+: 1e-4</text>
  <path d="M962 222.5 H972" class="arrow"/>
  <rect x="980" y="150" width="230" height="145" rx="18" fill="#d5e8dd" stroke="#2f7654" stroke-width="3"/>
  <text x="998" y="204" class="head">2-class head</text>
  <text x="998" y="238" class="body">warm 1e-3 → 5e-4</text>
  <rect x="60" y="340" width="1160" height="112" rx="18" fill="#ffffff" stroke="#cfd5d1" stroke-width="2"/>
  <text x="85" y="382" class="head">Two phases, one validation protocol</text>
  <text x="85" y="416" class="body">Epochs 1–4 train the head. Epoch 5 onward trains layer4 + head with AdamW and cosine decay.</text>
  <text x="85" y="440" class="body">Choose on validation. One test pass per model; corrected ResNet18 is the second model measured.</text>
</svg>
